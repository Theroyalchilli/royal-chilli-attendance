<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<title>No internet</title>
<style>
  /* Same look as components/StatusPage.tsx — shown by public/sw.js when there's no connection. */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FAF7F2; color: #201B18;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; padding: 24px; }
  .box { width: 100%; max-width: 360px; }
  img { width: 88px; height: 88px; border-radius: 22%; object-fit: cover; }
  .name { margin: 12px 0 0; font-size: 15px; font-weight: 600; }
  h1 { margin: 24px 0 0; font-size: 22px; font-weight: 600; }
  p { margin: 8px 0 0; font-size: 14px; color: #6B625B; }
  button { margin-top: 24px; width: 100%; padding: 13px 16px; border: 0; border-radius: 12px; background: #E34435; color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer; }
  .small { margin-top: 18px; font-size: 12px; color: #7C716A; }
</style>
</head>
<body>
  <div class="box">
    <img src="/brand-logo?v=2" alt="" onerror="this.style.display='none'">
    <p class="name" id="name"></p>
    <h1>📶 No internet</h1>
    <p>You're offline. Check Wi-Fi or mobile data.</p>
    <p>This page reloads by itself as soon as you're back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
  <script>
    fetch("/api/public/brand").then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d && d.name) { document.getElementById("name").textContent = d.name; document.title = d.name + " · No internet"; } })
      .catch(function () {});
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
